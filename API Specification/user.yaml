openapi: 3.0.3
info:
  title: User API Specification
  version: 1.0.0
  description: API quản lý tài khoản người dùng và phân quyền hệ thống.
paths:
  /users:
    get:
      summary: Lấy danh sách tài khoản (Dành cho Admin/Operator)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Thành công
    post:
      summary: Tạo tài khoản người dùng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, role]
              properties:
                email:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [CUSTOMER, DRIVER, OPERATOR, ADMIN]
      responses:
        '201':
          description: Tạo thành công
