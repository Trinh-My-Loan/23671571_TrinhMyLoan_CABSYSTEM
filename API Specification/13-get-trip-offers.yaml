openapi: 3.0.3
info:
  title: CAB System API - Get Trip Offers
  version: 1.0.0
  description: Driver xem các Trip Offer được gửi cho mình.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/drivers/me/trip-offers:
    get:
      summary: Get Trip Offers
      description: Driver xem các Trip Offer được gửi cho mình.
      tags:
        - Get Trip Offers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      trip_offers:
                        type: array
                        items:
                          type: object
                          properties:
                            offer_id: {type: integer, example: 201}
                            request_id: {type: integer, example: 101}
                            pickup_location: {type: string, example: Go Vap}
                            destination: {type: string, example: District 10}
                            status: {type: string, example: PENDING}
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
        '401':
          description: Chưa xác thực hoặc token không hợp lệ
        '403':
          description: Không có quyền thực hiện chức năng
        '404':
          description: Không tìm thấy tài nguyên
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
