openapi: 3.0.3
info:
  title: Driver API Specification
  version: 1.0.0
  description: API hồ sơ và quản lý tài xế.
paths:
  /drivers/me:
    get:
      summary: Lấy thông tin tài xế hiện tại
      responses:
        '200':
          description: Thành công
  /drivers/{id}/verify:
    patch:
      summary: Xác minh tài xế (Operator/Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
      responses:
        '200':
          description: Duyệt thành công
