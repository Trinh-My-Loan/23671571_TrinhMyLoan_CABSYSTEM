openapi: 3.0.3
info:
  title: Booking API Specification
  version: 1.0.0
  description: API tạo và quản lý yêu cầu đặt xe.
paths:
  /bookings:
    post:
      summary: Khách hàng tạo đơn đặt xe mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupLocation, dropoffLocation, vehicleType]
              properties:
                pickupLocation:
                  type: object
                  properties:
                    address:
                      type: string
                    lat:
                      type: number
                    lng:
                      type: number
                dropoffLocation:
                  type: object
                  properties:
                    address:
                      type: string
                    lat:
                      type: number
                    lng:
                      type: number
                vehicleType:
                  type: string
      responses:
        '201':
          description: Yêu cầu đặt xe đã ghi nhận thành công

  /bookings/{id}/cancel:
    post:
      summary: Hủy chuyến xe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hủy thành công
