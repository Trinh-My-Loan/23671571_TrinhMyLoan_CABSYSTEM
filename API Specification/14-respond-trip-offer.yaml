openapi: 3.0.3
info:
  title: CAB System API - Respond Trip Offer
  version: 1.0.0
  description: Driver Accept hoặc Reject Trip Offer.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/trip-offers/{id}/response:
    patch:
      summary: Respond Trip Offer
      description: Driver Accept hoặc Reject Trip Offer.
      tags:
        - Respond Trip Offer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mã định danh của tài nguyên
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  enum: [ACCEPT, REJECT]
                  example: ACCEPT
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      offer_id: {type: integer, example: 201}
                      status: {type: string, example: ACCEPTED}
                      trip_id: {type: integer, nullable: true, example: 501}
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
        '401':
          description: Chưa xác thực hoặc token không hợp lệ
        '403':
          description: Không có quyền thực hiện chức năng
        '404':
          description: Không tìm thấy tài nguyên
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
