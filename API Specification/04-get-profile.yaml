openapi: 3.0.3
info:
  title: CAB System API - Get Profile
  version: 1.0.0
  description: Xem hồ sơ của người dùng đang đăng nhập.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/users/me:
    get:
      summary: Get Profile
      description: Xem hồ sơ của người dùng đang đăng nhập.
      tags:
        - Get Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user_id: {type: integer, example: 1}
                      full_name: {type: string, example: Trinh My Loan}
                      phone: {type: string, example: "0901234567"}
                      email: {type: string, example: loan@example.com}
                      role: {type: string, example: Customer}
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
        '401':
          description: Chưa xác thực hoặc token không hợp lệ
        '403':
          description: Không có quyền thực hiện chức năng
        '404':
          description: Không tìm thấy tài nguyên
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
