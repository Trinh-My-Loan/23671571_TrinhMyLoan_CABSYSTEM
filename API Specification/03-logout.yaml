openapi: 3.0.3
info:
  title: CAB System API - Logout
  version: 1.0.0
  description: Đăng xuất người dùng đang đăng nhập.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/logout:
    post:
      summary: Logout
      description: Đăng xuất người dùng đang đăng nhập.
      tags:
        - Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message: {type: string, example: Logout successful}
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
        '401':
          description: Chưa xác thực hoặc token không hợp lệ
        '403':
          description: Không có quyền thực hiện chức năng
        '404':
          description: Không tìm thấy tài nguyên
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
