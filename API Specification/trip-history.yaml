openapi: 3.0.3
info:
  title: Trip History API Specification
  version: 1.0.0
  description: API xem lại lịch sử các chuyến xe.
paths:
  /trips/history:
    get:
      summary: Xem lịch sử chuyến đi của tài khoản
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Thành công
