openapi: 3.0.3
info:
  title: Trip API Specification
  version: 1.0.0
  description: API quản lý tiến trình của chuyến xe đang diễn ra.
paths:
  /trips/{id}/accept:
    post:
      summary: Tài xế chấp nhận đơn hàng/chuyến đi
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chấp nhận thành công

  /trips/{id}/status:
    patch:
      summary: Cập nhật trạng thái chuyến xe (ARRIVED, PICKED_UP, COMPLETED)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ARRIVED, PICKED_UP, COMPLETED]
      responses:
        '200':
          description: Cập nhật trạng thái thành công
