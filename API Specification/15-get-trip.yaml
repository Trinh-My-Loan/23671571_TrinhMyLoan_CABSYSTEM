openapi: 3.0.3
info:
  title: CAB System API - Get Trip
  version: 1.0.0
  description: Customer hoặc Driver xem thông tin chuyến liên quan.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/trips/{id}:
    get:
      summary: Get Trip
      description: Customer hoặc Driver xem thông tin chuyến liên quan.
      tags:
        - Get Trip
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mã định danh của tài nguyên
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      trip_id: {type: integer, example: 501}
                      customer_id: {type: integer, example: 1}
                      driver_id: {type: integer, example: 10}
                      vehicle_id: {type: integer, example: 5}
                      status: {type: string, example: Assigned}
                      pickup_location: {type: string, example: Go Vap}
                      destination: {type: string, example: District 10}
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
        '401':
          description: Chưa xác thực hoặc token không hợp lệ
        '403':
          description: Không có quyền thực hiện chức năng
        '404':
          description: Không tìm thấy tài nguyên
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
