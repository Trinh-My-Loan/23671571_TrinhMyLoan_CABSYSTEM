openapi: 3.0.3
info:
  title: Vehicle API Specification
  version: 1.0.0
  description: API thông tin phương tiện xe.
paths:
  /vehicles:
    post:
      summary: Khai báo/Đăng ký xe mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licensePlate, brand, seats]
              properties:
                licensePlate:
                  type: string
                brand:
                  type: string
                seats:
                  type: integer
      responses:
        '201':
          description: Tạo thành công
