openapi: 3.0.3

info:
  title: CAB System API
  version: 1.0.0
  description: >
    API Specification for the CAB ride-booking system.

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Authentication
  - name: Users
  - name: Trips
  - name: Drivers
  - name: Payments
  - name: Ratings
  - name: Administration
  - name: Reports

paths:

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                password:
                  type: string
              required:
                - fullName
                - phone
                - password

      responses:
        '201':
          description: Tạo tài khoản thành công

        '400':
          description: Dữ liệu không hợp lệ

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập hệ thống

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                password:
                  type: string
              required:
                - phone
                - password

      responses:
        '200':
          description: Đăng nhập thành công

        '401':
          description: Thông tin đăng nhập không hợp lệ

  /trips:
    post:
      tags:
        - Trips
      summary: Tạo yêu cầu đặt xe

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupLocation:
                  type: string
                destinationLocation:
                  type: string
                vehicleTypeId:
                  type: string
              required:
                - pickupLocation
                - destinationLocation
                - vehicleTypeId

      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công

        '400':
          description: Thông tin đặt xe không hợp lệ
